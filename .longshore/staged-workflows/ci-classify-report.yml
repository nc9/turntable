# Staged for #776 (the lane token cannot push .github/workflows). Add this job to
# .github/workflows/ci.yml under `jobs:`. It is NOT in ci-ok's needs, changes no other job, and
# a failure here cannot fail the merge group (continue-on-error).
classify-report:
  if: github.event_name == 'merge_group' && vars.TURNTABLE_CI != 'true'
  runs-on: ubuntu-24.04
  timeout-minutes: 5
  continue-on-error: true
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.5
    - name: What the classifier would skip (report only)
      env:
        MG_BASE: ${{ github.event.merge_group.base_sha }}
        MG_HEAD: ${{ github.event.merge_group.head_sha }}
      run: |
        {
          echo '### Classifier (report only)'
          echo '```'
          bun scripts/ci-classify.ts --base "${MG_BASE}" --head "${MG_HEAD}"
          echo '```'
        } | tee -a "${GITHUB_STEP_SUMMARY}"
