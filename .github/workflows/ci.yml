# Bootstrap CI on GitHub Actions, also run by Turntable itself (dogfood). The Turntable project sets
# the variable TURNTABLE_CI=true (`turntable policy set --ingest on --var TURNTABLE_CI=true`); GitHub
# has no such variable. Jobs that need a docker daemon or service containers are gated off under
# Turntable (`vars.TURNTABLE_CI != 'true'`), and `postgres-pglite` runs only there.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds a temporary branch and waits for this workflow; the full suite always runs.
  merge_group:
    types: [checks_requested]
  # Re-run CI on a main sha by hand when its push run was skipped or cancelled (#444's squash body
  # carried a [skip ci] onto main 71044470, and there was no way to re-trigger it).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A merge group has its own ref, and its own key here too, and is never cancelled by a newer run.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && 'mq' || 'run' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Decides whether a pull request touches only docs. Merge groups, pushes and manual runs are never
  # docs-only, so the full suite always runs before and after a merge. Any doubt means "not docs-only".
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Turntable delivers a depth-1 tree until full history lands (#525); with depth 1 the
          # diff below fails and the run counts as "not docs-only" (the full suite runs).
          fetch-depth: ${{ vars.TURNTABLE_CI == 'true' && 1 || 0 }}
      - name: Is this a docs-only pull request
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docs_only=false
          base=""
          case "${EVENT}" in
            pull_request) base="${PR_BASE}" ;;
            merge_group) base="${MG_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
          esac
          case "${base}" in
            ""|*[!0-9a-f]*|0000000000000000000000000000000000000000) base="" ;;
          esac
          # Docs-only skipping applies to pull requests only. --no-renames lists both sides of a
          # rename, so moving a source file under docs/ is not mistaken for a docs-only change.
          if [ "${EVENT}" = "pull_request" ] && [ -n "${base}" ] && files="$(git diff --no-renames --name-only "${base}" "${HEAD_SHA}")" && [ -n "${files}" ]; then
            docs_only=true
            while IFS= read -r f; do
              case "${f}" in
                docs/*|*.md|*.mdx) ;;
                *) docs_only=false; break ;;
              esac
            done <<< "${files}"
          fi
          echo "event=${EVENT} base=${base:-none} docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"

  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      # A shipped migration is immutable: its hash in migration-shas.json may only be appended to,
      # or edited with the tag named in EDITED_IN_PLACE in the same PR. The base is the PR merge
      # commit's OWN first parent (the base branch as it was when refs/pull/N/merge was built),
      # never the moving tip of the branch: main can gain golden entries between that build and
      # this run, and a stale head against a fresh tip reads as "the head removed them".
      # The checkout is depth 1, so the script fetches exactly that parent by its sha (never history);
      # the event's base sha is only the fallback for a head that is not a merge commit, and an older
      # base is harmless (the head's extra entries are appends).
      - name: Migration hashes are only appended to
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: bun run scripts/check-migration-shas-diff.ts --base auto --base-repo "${REPO}" --base-sha "${BASE_SHA}"
      - name: Everything fetched is pinned by digest, commit or checksum
        run: bun run scripts/check-pins.ts
      - run: bun fmt --check
      - run: bun run typecheck
      - name: One bun version in every workflow and the Dockerfile
        run: bun run scripts/toolchain-versions.ts
      - name: The operations table matches the registry
        run: bun run scripts/ops-table.ts --check
      - name: The configuration reference matches the code
        run: bun run scripts/config-reference.ts --check
      - name: Migrations match schema and embedded modules are current (SQLite and Postgres)
        timeout-minutes: 5
        run: |
          bun run --cwd packages/core db:generate
          paths="packages/core/drizzle packages/core/drizzle-pg packages/core/src/db/migrations.generated.ts packages/core/src/db/migrations.pg.generated.ts packages/core/src/db/schema.pg.ts packages/core/src/db/schema.ts"
          if [ -n "$(git status --porcelain $paths)" ]; then
            echo "schema.sqlite.ts changed without committed migrations or generated schema; run: bun run --cwd packages/core db:generate"
            git status --porcelain $paths
            exit 1
          fi
      - run: bun run test
      - run: bun run build
        env:
          # Re-signs the darwin binary with the pinned rcodesign and verifies the signature.
          TURNTABLE_SIGN_DARWIN: "1"
      - name: Darwin signature is fresh ad-hoc, and SHA256SUMS matches the signed files
        run: |
          bun run scripts/rcodesign.ts verify dist/turntable-darwin-arm64
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Smoke the linux-x64 binary
        run: scripts/smoke.sh dist/turntable-linux-x64

  # The core and ops suites against a real Postgres (the same suites as `bun run test`, with every
  # test given a fresh database). SQLite-only tests are listed in scripts/run-tests-pg.ts.
  postgres:
    needs: changes
    if: vars.TURNTABLE_CI != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # postgres 17 alpine multi-arch index digest
        image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
        env:
          # No credential at all: the service is reachable only from this job's own runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --shm-size 256m
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Core and ops suites on Postgres
        env:
          TURNTABLE_TEST_DB: postgres://postgres@localhost:5432/postgres
          # 4 vCPUs: three chunks at once. The timing-sensitive tests have explicit timeouts (#486),
          # so three no longer times them out; each test schema is named per process id
          TURNTABLE_PG_TEST_CONCURRENCY: "3"
        run: bun run pg:test

  # Turntable only: no service containers in a sandbox, so the same suites run on in-process
  # PGlite. GitHub CI runs the real-Postgres job above instead, so this one is not doubled there.
  postgres-pglite:
    needs: changes
    if: vars.TURNTABLE_CI == 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Core and ops suites on PGlite
        env:
          TURNTABLE_TEST_DB: pglite
        run: bun run pg:test

  # New dependency versions in bun.lock must be at least 14 days old (scripts/dep-age.ts).
  dep-age:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Compare bun.lock with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          # The base branch from git when it is there (GitHub's checkout with fetch-depth 0). A
          # checkout of only the one commit (Turntable's) has no origin/<base>: the script then
          # fetches the base lockfile by its sha.
          if ! git show "origin/${BASE_REF}:bun.lock" > "${RUNNER_TEMP}/base.bun.lock" 2>/dev/null; then
            echo "no origin/${BASE_REF} here: fetching the base lockfile at ${BASE_SHA}"
            rm -f "${RUNNER_TEMP}/base.bun.lock"
            bun run scripts/dep-age.ts --base "${RUNNER_TEMP}/base.bun.lock" --base-repo "${REPO}" --base-sha "${BASE_SHA}"
            exit $?
          fi
          bun run scripts/dep-age.ts --base "${RUNNER_TEMP}/base.bun.lock"

  # The release golden path, end to end in process: tag push, release-class run, artifacts, release
  # request, tag and digest re-check, approval quorum, signing, strict publish to fake npm and
  # GitHub, `turntable verify`, and one negative per gate. Slower than a unit test, so it is its own job.
  release-golden:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run test:golden

  provider-docker:
    needs: changes
    if: vars.TURNTABLE_CI != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Docker provider conformance
        env:
          # alpine 3.22 multi-arch index digest
          TT_DOCKER_IMAGE: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
        run: bun run test:docker

  act-runner-e2e:
    needs: changes
    if: vars.TURNTABLE_CI != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Run the example workflow in a Docker sandbox with act
        env:
          # Host mode runs steps on the sandbox itself, so the image needs bash, git and node.
          # node:22-bookworm has all three; ubuntu:24.04 has none. Multi-arch index digest.
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:act-e2e
      - name: A missing tool is named in the log
        env:
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:missing-tool-e2e
      - name: A job behind the secrets proxy (internal network and relay)
        env:
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:proxy-e2e
      - name: Job cache end to end (real act and actions/cache in separate sandboxes)
        env:
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:cache-e2e
      - name: Artifacts end to end (real act and the pinned artifact actions)
        env:
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:artifacts-e2e
      - name: Vault JWT auth against the per-org OIDC issuer
        env:
          # A Vault dev server on the host network; multi-arch index digest of hashicorp/vault 1.20.
          TT_VAULT_IMAGE: hashicorp/vault:1.20@sha256:268bb80aa9c6d13d65fcfa05c0c268caca068952240a8087291a6ce0b66e3a10
        run: bun run test:vault-e2e
      - name: Build the linux-x64 binary
        run: bun run scripts/build.ts bun-linux-x64
      - name: turntable run end to end (compiled binary, docker provider)
        env:
          TT_BINARY: dist/turntable-linux-x64
          # Read-only: lifts the unauthenticated rate limit of the action commit verification.
          TURNTABLE_GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:run-e2e

  runner-image:
    needs: changes
    if: vars.TURNTABLE_CI != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Build the runner image (not pushed)
        run: docker build -t turntable-runner:ci images/runner
      - name: pwsh runs
        run: docker run --rm --network none turntable-runner:ci pwsh -NoProfile -Command 'Write-Output "pwsh-ok"' # pin-ok: the image built by the step above
      - name: The compatibility table matches the image
        run: bun run scripts/runner-toolset.ts --image turntable-runner:ci --check

  docker:
    needs: changes
    if: vars.TURNTABLE_CI != 'true' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build the amd64 image for a smoke run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: turntable:smoke
      - name: Run the distroless image (healthz, UI, CSP, PORT, bootstrap token, a real worker checkout)
        run: scripts/smoke-image.sh turntable:smoke

  # The one required check for the ruleset. A skipped job is fine: only `changes` (docs-only pull
  # requests) or the TURNTABLE_CI gates skip jobs. A failed or cancelled job fails this one.
  ci-ok:
    needs:
      - changes
      - check
      - postgres
      - postgres-pglite
      - dep-age
      - release-golden
      - provider-docker
      - act-runner-e2e
      - runner-image
      - docker
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad="$(printf '%s' "${NEEDS}" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "not green:"
            echo "${bad}"
            exit 1
          fi
          echo "all needed jobs succeeded or were skipped"
