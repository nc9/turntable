# Bootstrap CI on GitHub Actions. Longshore will run its own CI later.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Migrations match schema and embedded module is current
        timeout-minutes: 5
        run: |
          bun run --cwd packages/core db:generate
          if [ -n "$(git status --porcelain packages/core/drizzle packages/core/src/db/migrations.generated.ts)" ]; then
            echo "schema.ts changed without committed migrations; run: bun run --cwd packages/core db:generate"
            git status --porcelain packages/core/drizzle packages/core/src/db/migrations.generated.ts
            exit 1
          fi
      - run: bun run test
      - run: bun run build
        env:
          # Re-signs the darwin binary with the pinned rcodesign and verifies the signature.
          LONGSHORE_SIGN_DARWIN: "1"
      - name: Darwin signature is fresh ad-hoc, and SHA256SUMS matches the signed files
        run: |
          bun run scripts/rcodesign.ts verify dist/longshore-darwin-arm64
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Smoke the linux-x64 binary
        run: scripts/smoke.sh dist/longshore-linux-x64

  # New dependency versions in bun.lock must be at least 14 days old (scripts/dep-age.ts).
  dep-age:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: Compare bun.lock with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git show "origin/${BASE_REF}:bun.lock" > "${RUNNER_TEMP}/base.bun.lock"
          bun run scripts/dep-age.ts --base "${RUNNER_TEMP}/base.bun.lock"

  provider-docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Docker provider conformance
        env:
          # alpine 3.22 multi-arch index digest
          TT_DOCKER_IMAGE: alpine:3.22@sha256:49340b346798875b5592e5d420241f2f9cfba5f47e62ebb1446a1b34734e898f
        run: bun run test:docker

  act-runner-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - name: Run the example workflow in a Docker sandbox with act
        env:
          # Host mode runs steps on the sandbox itself, so the image needs bash, git and node.
          # node:22-bookworm has all three; ubuntu:24.04 has none. Multi-arch index digest.
          TT_ACT_IMAGE: node:22-bookworm@sha256:e13726ca604184d7a91fcacab1fc09eefd642dc28e79ac34e85540dd93b78cfb
        run: bun run test:act-e2e
      - name: Build the linux-x64 binary
        run: bun run scripts/build.ts bun-linux-x64
      - name: longshore run end to end (compiled binary, docker provider)
        env:
          TT_BINARY: dist/longshore-linux-x64
          # Read-only: lifts the unauthenticated rate limit of the action commit verification.
          LONGSHORE_GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:run-e2e

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
      - name: Build the amd64 image for a smoke run
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: longshore:smoke
      - name: Run the distroless image (healthz, UI, CSP, PORT, bootstrap token)
        run: scripts/smoke-image.sh longshore:smoke
