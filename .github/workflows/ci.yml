# Bootstrap CI on GitHub Actions. Turntable will run its own CI later.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - name: Migrations match schema and embedded module is current
        timeout-minutes: 5
        run: |
          bun run --cwd packages/core db:generate
          if [ -n "$(git status --porcelain packages/core/drizzle packages/core/src/db/migrations.generated.ts)" ]; then
            echo "schema.ts changed without committed migrations; run: bun run --cwd packages/core db:generate"
            git status --porcelain packages/core/drizzle packages/core/src/db/migrations.generated.ts
            exit 1
          fi
      - run: bun test packages/core/tests
      - run: bun run build
      - name: Smoke the linux-x64 binary
        run: scripts/smoke.sh dist/turntable-linux-x64

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build multi-arch image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
