name: release

on:
  push:
    tags: ["v*"]
  # A dry run: builds every target, signs darwin, writes SHA256SUMS and the SBOM, smoke-runs the
  # image, and checks Turntable's own provenance path on the binaries. It publishes nothing: no
  # release, no image push, no attestation (those write to public logs), no upload but one
  # workflow artifact. Its jobs have read-only permissions, so they could not publish if they tried.
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the dry run (not a tag, nothing is created)"
        default: "v0.0.0-dryrun.1"
        required: true

permissions: {}

env:
  # The tag on a tag push; the label given on a manual dry run.
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

# Never cancel: a cancelled release is a half-published release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          TURNTABLE_VERSION: ${{ env.RELEASE_VERSION }}
          # Re-sign darwin with the pinned rcodesign BEFORE hashing, so SHA256SUMS matches
          # what users download.
          TURNTABLE_SIGN_DARWIN: "1"
      - name: Verify the darwin signature and SHA256SUMS
        run: |
          bun run scripts/rcodesign.ts verify dist/turntable-darwin-arm64
          (cd dist && sha256sum -c SHA256SUMS)
      - run: scripts/smoke.sh dist/turntable-linux-x64
      - name: SBOM (CycloneDX) for the binaries, hashed into SHA256SUMS
        env:
          REF_NAME: ${{ env.RELEASE_VERSION }}
        run: |
          sbom="turntable-${REF_NAME#v}.cdx.json"
          bun run scripts/sbom.ts --version "${REF_NAME}" --out "dist/${sbom}"
          (cd dist && sha256sum "${sbom}" >> SHA256SUMS && sha256sum -c SHA256SUMS)
          # The list is complete (every binary and the SBOM, nothing else) and the SBOM is exactly
          # what the lockfile ships, before anything is attested or uploaded.
          bun run scripts/release-checks.ts sums dist
          bun run scripts/release-checks.ts sbom "dist/${sbom}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The same commit built twice, the second time in a fresh copy at another path with a fresh
  # install, gives identical bytes. A release that is not reproducible is not published.
  reproducible:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      # Two more builds of this commit (the second in a fresh copy at another path), which must
      # agree with each other AND with what the `binaries` job built and will publish. The darwin
      # binary is left out of the second comparison: it is signed after the compile.
      - name: Rebuild twice and compare with the published list
        env:
          TURNTABLE_VERSION: ${{ env.RELEASE_VERSION }}
        run: bun run scripts/repro-check.ts --expect dist/SHA256SUMS

  github-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, reproducible]
    # Publishing waits for the `release` environment's approval (on GitHub: its protection rules;
    # through Turntable: a held environment approval). Unprotected, GitHub creates it on first use.
    environment: release
    # Every step that PUBLISHES (attestations, the GitHub release) is gated: GitHub publishes only when the
    # repository variable PUBLISH_FROM_GITHUB is `true`, and never under Turntable (TURNTABLE_CI), which
    # publishes through the release lane. The checks and the build still run.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Draft release notes from conventional commits
        env:
          REF_NAME: ${{ env.RELEASE_VERSION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/release-notes.ts --to "${REF_NAME}" --out release-notes.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          subject-path: |
            dist/turntable-linux-*
            dist/turntable-darwin-*
            dist/SHA256SUMS
      - name: Name the SBOM file
        id: sbom
        env:
          REF_NAME: ${{ env.RELEASE_VERSION }}
        run: echo "path=dist/turntable-${REF_NAME#v}.cdx.json" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          subject-path: |
            dist/turntable-linux-*
            dist/turntable-darwin-*
          sbom-path: ${{ steps.sbom.outputs.path }}
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
          fail_on_unmatched_files: true

  image:
    # After the release exists, so the image SBOM can be attached to it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, github-release]
    # Publishes the image: gated by the same environment as the release it attaches to.
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        env:
          REF_NAME: ${{ env.RELEASE_VERSION }}
        run: |
          version="${REF_NAME#v}"
          tags="ghcr.io/nc9/turntable:${version}"
          if [[ "${version}" != *-* ]]; then
            tags="${tags},ghcr.io/nc9/turntable:latest"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      # The image that is about to be pushed is started and checked first (libc fit, healthz, the
      # UI and its CSP, PORT, the bootstrap token): a broken image is never published.
      - name: Build the amd64 image and run it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: turntable:release-smoke
          build-args: |
            TURNTABLE_VERSION=${{ steps.tags.outputs.version }}
      - name: Smoke-run the image
        run: scripts/smoke-image.sh turntable:release-smoke
      - id: push
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TURNTABLE_VERSION=${{ steps.tags.outputs.version }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          subject-name: ghcr.io/nc9/turntable
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      # Syft is pinned by version; the action by commit. The SBOM covers the OS packages of the
      # distroless base and the binary, as the registry holds them (by digest).
      - name: SBOM (CycloneDX) for the image
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/nc9/turntable@${{ steps.push.outputs.digest }}
          syft-version: v1.57.0
          format: cyclonedx-json
          output-file: turntable-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: The image SBOM saw the image's packages
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        run: bun run scripts/release-checks.ts image-sbom turntable-image.cdx.json
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        with:
          subject-name: ghcr.io/nc9/turntable
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: turntable-image.cdx.json
          push-to-registry: true
      - name: Attach the image SBOM to the release
        if: vars.TURNTABLE_CI != 'true' && vars.PUBLISH_FROM_GITHUB == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ env.RELEASE_VERSION }}
        run: gh release upload "${REF_NAME}" turntable-image.cdx.json --repo "${GITHUB_REPOSITORY}"

  # ---- dry run (workflow_dispatch): the same checks, nothing published ----

  dry-run:
    if: github.event_name == 'workflow_dispatch'
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums still match what was downloaded
        run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Draft release notes from conventional commits (not published)
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/release-notes.ts --to "${GITHUB_SHA}" --out release-notes.md
      - name: Provenance through Turntable's own path, verified, with a negative control
        env:
          VERSION: ${{ env.RELEASE_VERSION }}
          REF: ${{ github.ref }}
        run: |
          bun run scripts/dry-run-provenance.ts --dist dist --out dry-run \
            --version "${VERSION}" --repo "${GITHUB_REPOSITORY}" --sha "${GITHUB_SHA}" --ref "${REF}"
      - name: What would be released
        run: |
          {
            echo "## Release dry run ${RELEASE_VERSION}"
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo "Nothing was published: no release, no image push, no attestation."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/
            dry-run/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  image-dry-run:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # No login and no push: this job has no credentials for a registry.
      - name: Build both architectures (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            TURNTABLE_VERSION=${{ env.RELEASE_VERSION }}
      - name: Build the amd64 image and run it
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: turntable:release-smoke
          build-args: |
            TURNTABLE_VERSION=${{ env.RELEASE_VERSION }}
      - name: Smoke-run the image (healthz, UI, CSP, PORT, bootstrap token)
        run: scripts/smoke-image.sh turntable:release-smoke
      # The SBOM step of the real release, on the image just built (a local image: no registry, no
      # attestation, nothing published). It proves Syft runs and sees the image's packages.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - name: SBOM (CycloneDX) for the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: turntable:release-smoke # pin-ok: the image built by the step above
          syft-version: v1.57.0
          format: cyclonedx-json
          output-file: turntable-image.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: The image SBOM saw the image's packages
        run: bun run scripts/release-checks.ts image-sbom turntable-image.cdx.json
