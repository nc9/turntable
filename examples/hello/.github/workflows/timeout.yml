name: timeout
on: push
jobs:
  timeout:
    runs-on: ubuntu-latest
    steps:
      - name: Hang past the step timeout
        timeout-minutes: 1
        run: |
          echo "hang-started"
          sleep 600
          echo "hang-not-reached"
      - name: Nothing is left running
        if: always()
        run: |
          # Count processes whose command line is `sleep 600` (read from /proc: no ps needed).
          count() {
            n=0
            for p in /proc/[0-9]*; do
              c=$(tr '\0' ' ' < "$p/cmdline" 2>/dev/null || true)
              case "$c" in "sleep 600"*) n=$((n + 1)) ;; esac
            done
            echo "$n"
          }
          i=0
          while [ "$(count)" -ne 0 ] && [ "$i" -lt 15 ]; do sleep 1; i=$((i + 1)); done
          echo "left=$(count)"
          test "$(count)" -eq 0
